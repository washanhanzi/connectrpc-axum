[config]
default_to_workspace = false
skip_core_tasks = true

# ============================================================================
# Test Tasks
# ============================================================================

[tasks.test]
description = "Run all cross-implementation integration tests"
category = "Testing"
command = "cargo"
args = ["run", "-p", "connectrpc-axum-test"]

[tasks.test-unit]
description = "Run cargo tests (unit, doc, and trybuild UI tests)"
category = "Testing"
command = "cargo"
args = ["test", "--workspace"]

[tasks.test-client-no-default-features]
description = "Run client tests without default features"
category = "Testing"
command = "cargo"
args = ["test", "-p", "connectrpc-axum-client", "--no-default-features"]

# ============================================================================
# CI Tasks
# ============================================================================

[tasks.fmt-check]
description = "Check Rust formatting"
category = "CI"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
description = "Run Clippy with warnings denied"
category = "CI"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
  "-A",
  "clippy::result-large-err",
  "-A",
  "clippy::type-complexity",
  "-A",
  "clippy::too-many-arguments",
]

[tasks.ci]
description = "Run all CI checks (fmt, clippy, test)"
category = "CI"
dependencies = ["fmt-check", "clippy", "test-unit", "test-client-no-default-features", "test"]

[tasks.ci-quick]
description = "Run quick CI checks (fmt, clippy only)"
category = "CI"
dependencies = ["fmt-check", "clippy"]
